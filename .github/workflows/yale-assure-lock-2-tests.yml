name: Yale Assure Lock 2 tests

on:
  push:
    paths:
      - 'yale-assure-lock-2/**'
      - 'tools/groovy-jar.sh'
      - '.github/workflows/yale-assure-lock-2-tests.yml'
  pull_request:
    paths:
      - 'yale-assure-lock-2/**'
      - 'tools/groovy-jar.sh'
      - '.github/workflows/yale-assure-lock-2-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # Groovy 2.4, the line the hub runs, wants Java 8.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Off-hub tests
        run: yale-assure-lock-2/tests/run.sh
