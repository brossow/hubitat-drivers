services:
  bambu-bridge:
    build: .
    container_name: bambu-bridge
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,time; f='/tmp/bambu-healthy'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<300 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
