name: Xiaomi/Aqara T&H tests

on:
  push:
    paths:
      - 'xiaomi-aqara/th-sensor/**'
      - 'tools/groovy-jar.sh'
      - '.github/workflows/xiaomi-aqara-th-tests.yml'
  pull_request:
    paths:
      - 'xiaomi-aqara/th-sensor/**'
      - 'tools/groovy-jar.sh'
      - '.github/workflows/xiaomi-aqara-th-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # Groovy 2.4, the line the hub runs, wants Java 8.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Off-hub tests
        run: xiaomi-aqara/th-sensor/tests/run.sh
